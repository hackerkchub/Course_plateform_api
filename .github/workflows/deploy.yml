name: Deploy Course Platform Backend

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

concurrency:
  group: course-platform-backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-testing:
    name: Sync Backend to Testing Server (FTP/FTPS)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create LiteSpeed / Passenger Restart Marker
        run: |
          mkdir -p tmp
          echo "deploy-${{ github.sha }}-$(date +%s)" > tmp/restart.txt

      - name: Sync Backend Files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Target server host or IP (e.g. ftp.yourdomain.com or host IP)
          server: ${{ secrets.FTP_SERVER }}
          
          # FTP username (e.g. deployer@yourdomain.com or cPanel username)
          username: ${{ secrets.FTP_USERNAME }}
          
          # FTP user password
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Security protocol: 'ftps' (explicit TLS, recommended) with fallback support
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          
          # Port: standard port 21 (confirmed by host) or custom if specified
          port: ${{ secrets.FTP_PORT || 21 }}
          
          # Local directory to sync (repository root)
          local-dir: ./
          
          # Remote server directory: defaults to root './' of the mapped FTP directory.
          # If the FTP user was NOT rooted directly at the application folder,
          # configure FTP_SERVER_DIR in GitHub Secrets (must end with a trailing '/').
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          
          # Safety: Never wipe or delete existing unmanaged files on the remote server
          dangerous-clean-slate: false
          
          # File and directory exclusions:
          # Protects secrets, server uploads, runtime logs, dependency trees, and dev artifacts.
          # Note: Root storage and artifact directories are anchored (uploads/**, logs/**)
          # so that nested source code modules (e.g. src/modules/uploads/**) are not accidentally excluded.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env*
            **/.env.*
            uploads/**
            logs/**
            coverage/**
            scratch/**
            tests/**
            **/*.log
            **/.DS_Store
            **/powershell.cmd
            **/*.tmp
            **/*.temp

  deploy-production:
    name: Deploy Backend to Guidexa Production (Plain FTP)
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create LiteSpeed / Passenger Restart Marker
        run: |
          mkdir -p tmp
          echo "deploy-${{ github.sha }}-$(date +%s)" > tmp/restart.txt

      - name: Sync Backend Files via Plain FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Production server host or IP
          server: ${{ secrets.PROD_FTP_SERVER || secrets.FTP_SERVER }}
          
          # Dedicated production FTP username
          username: ${{ secrets.PROD_FTP_USERNAME || secrets.FTP_USERNAME }}
          
          # Dedicated production FTP password
          password: ${{ secrets.PROD_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          
          # Protocol strictly plain FTP (No FTPS / SFTP)
          protocol: ftp
          
          # Port strictly 21
          port: 21
          
          # Local directory to sync (repository root)
          local-dir: ./
          
          # Dedicated production destination directory (must be configured in secrets without fallback to ./)
          server-dir: ${{ secrets.FTP_PROD_SERVER_DIR || secrets.PROD_FTP_SERVER_DIR }}
          
          # Safety: Never delete existing unmanaged files on the remote production server
          dangerous-clean-slate: false
          
          # File and directory exclusions:
          # Protects secrets, production uploads, runtime logs, cPanel .htaccess, and dev artifacts
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env*
            **/.env.*
            **/.htaccess
            uploads/**
            logs/**
            coverage/**
            scratch/**
            tests/**
            **/*.log
            **/.DS_Store
            **/powershell.cmd
            **/*.tmp
            **/*.temp
